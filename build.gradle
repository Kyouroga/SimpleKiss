import org.gradle.api.tasks.bundling.Jar

group = 'org.kyouroga'
version = '1.1.0'

def artifactNames = [
    bukkit: 'SimpleKiss-Spigot',
    bungee: 'SimpleKiss-BungeeCord',
    velocity: 'SimpleKiss-Velocity'
]

subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven {
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
    }

    def currentJava = JavaVersion.current()

    java {
        sourceCompatibility = currentJava
        targetCompatibility = currentJava
        toolchain {
            languageVersion = JavaLanguageVersion.of(currentJava.majorVersion.toInteger())
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = currentJava.majorVersion.toInteger()
        options.encoding = 'UTF-8'
    }

    tasks.withType(Jar).configureEach {
        archiveVersion.set('')
        archiveClassifier.set('')
        if (artifactNames.containsKey(project.name)) {
            archiveBaseName.set(artifactNames[project.name])
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from(project(':common').sourceSets.main.output)
            from(project(':bootstrap').sourceSets.main.output)
            from(project(':universal').sourceSets.main.output)
        }
    }
}

def platformProjects = subprojects.findAll { artifactNames.containsKey(it.name) }

tasks.register('copyArtifacts', Copy) {
    group = 'build'
    description = 'Copies built platform jars into the root target directory'
    dependsOn platformProjects.collect { it.tasks.named('jar') }

    from(platformProjects.collect { it.layout.buildDirectory.dir('libs') }) {
        include '*.jar'
        eachFile { file -> file.path = file.name }
    }

    into rootProject.layout.projectDirectory.dir('target')
}

tasks.register('verifyPlatformJars') {
    group = 'verification'
    description = 'Verifies that built platform jars contain required shared API classes.'
    dependsOn platformProjects.collect { it.tasks.named('jar') }

    doLast {
        def requiredEntries = [
            'org/kyouroga/simplekiss/api/SimpleKissBridge.class',
            'org/kyouroga/simplekiss/bootstrap/BootstrapInitializer.class'
        ]

        platformProjects.each { project ->
            def jarFile = project.layout.buildDirectory.file("libs/${artifactNames[project.name]}.jar").get().asFile
            if (!jarFile.exists()) {
                throw new GradleException("Missing jar for platform project: ${project.name}")
            }
            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                requiredEntries.each { entry ->
                    if (zip.getEntry(entry) == null) {
                        throw new GradleException("Jar verification failed for ${jarFile.name}: missing ${entry}")
                    }
                }
            } finally {
                zip.close()
            }
        }
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds all subprojects and copies their jars into the root target folder'
    dependsOn(subprojects.collect { it.tasks.named('build') })
    dependsOn(tasks.named('verifyPlatformJars'))
    dependsOn(tasks.named('copyArtifacts'))
}

tasks.register('clean') {
    group = 'build'
    description = 'Cleans all subprojects and removes the root target folder'
    dependsOn(subprojects.collect { it.tasks.named('clean') })
    doLast {
        delete rootProject.file('target')
    }
}
