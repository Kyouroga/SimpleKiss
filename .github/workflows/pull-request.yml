name: Process Pull Request

on:
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests and build
        run: ./gradlew clean test build

      - name: Upload Spigot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKiss-Spigot.jar
          if-no-files-found: error
          retention-days: 2
          path: bukkit/build/libs/SimpleKiss-Spigot.jar

      - name: Upload BungeeCord artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKiss-BungeeCord.jar
          if-no-files-found: error
          retention-days: 2
          path: bungee/build/libs/SimpleKiss-BungeeCord.jar

      - name: Upload Velocity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKiss-Velocity.jar
          if-no-files-found: error
          retention-days: 2
          path: velocity/build/libs/SimpleKiss-Velocity.jar

      - name: Build summary
        if: always()
        run: |
          ARTIFACTS_URL="https://${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/suites/${GITHUB_RUN_ID}/artifacts"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pull Request Build Summary

          | Item | Value |
          | --- | --- |
          | Trigger | pull_request |
          | Validation | Gradle test and build |
          | Artifacts | [Download artifacts](${ARTIFACTS_URL}) |

          | Artifact | Download |
          | --- | --- |
          | SimpleKiss-Spigot.jar | [Download](${ARTIFACTS_URL}) |
          | SimpleKiss-BungeeCord.jar | [Download](${ARTIFACTS_URL}) |
          | SimpleKiss-Velocity.jar | [Download](${ARTIFACTS_URL}) |
          EOF
