name: Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Read version
        run: echo "PROJECT_VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')" >> "$GITHUB_ENV"

      - name: Build all platforms
        run: ./gradlew clean build

      - name: Upload Spigot artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKiss-Spigot.jar
          if-no-files-found: error
          path: bukkit/build/libs/SimpleKiss-Spigot.jar

      - name: Upload BungeeCord artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKiss-BungeeCord.jar
          if-no-files-found: error
          path: bungee/build/libs/SimpleKiss-BungeeCord.jar

      - name: Upload Velocity artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKiss-Velocity.jar
          if-no-files-found: error
          path: velocity/build/libs/SimpleKiss-Velocity.jar

      - name: Build summary
        if: always()
        run: |
          ARTIFACTS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/suites/${GITHUB_RUN_ID}/artifacts"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Build Summary

          | Item | Value |
          | --- | --- |
          | Trigger | push |
          | Version | ${PROJECT_VERSION} |
          | Artifacts | [Download artifacts](${ARTIFACTS_URL}) |
          EOF
