plugins {
    id 'java-library'
}

group = 'org.kyouroga'
version = '1.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
    implementation 'org.yaml:snakeyaml:2.0'
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.4'
}
